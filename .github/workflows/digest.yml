name: Market digest

on:
  schedule:
    # GitHub cron — в UTC и может запаздывать на 5–20 минут.
    - cron: "45 4 * * *"    # ≈ 08:00 МСК — дайджест в Telegram + обновление приложения
    - cron: "45 12 * * *"   # ≈ 16:00 МСК — дайджест в Telegram + обновление приложения
    - cron: "15 * * * *"    # каждый час — только котировки/индексы для приложения
  workflow_dispatch:
    inputs:
      mode:
        description: "digest — рассылка в Telegram + приложение; data — только данные приложения"
        type: choice
        options: [digest, data]
        default: digest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Choose mode
        id: mode
        env:
          # Cloudflare Pages включается, когда заданы секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID
          CF_ON: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'mcqcryptonews' }}
          CUSTOM_URL: ${{ vars.WEBAPP_URL }}
          TG_URL: ${{ vars.TG_WEBAPP_URL }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          gh_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "WEBAPP_URL_OLD=$gh_url" >> "$GITHUB_ENV"
          echo "CF_ON=$CF_ON" >> "$GITHUB_ENV"
          echo "CF_PROJECT=$CF_PROJECT" >> "$GITHUB_ENV"
          if [ -n "$CUSTOM_URL" ]; then url="${CUSTOM_URL%/}/"
          elif [ "$CF_ON" = "true" ]; then url="https://${CF_PROJECT}.pages.dev/"
          else url="$gh_url"; fi
          echo "WEBAPP_URL=$url" >> "$GITHUB_ENV"
          echo "Адрес приложения: $url"
          # мини-приложение в Telegram — со старого адреса GitHub Pages (Cloudflare в России замедляют);
          # там лежит полная копия приложения для Telegram. Свой адрес — переменная TG_WEBAPP_URL.
          if [ -n "$TG_URL" ]; then tg="${TG_URL%/}/"; elif [ "$CF_ON" = "true" ]; then tg="$gh_url"; else tg="$url"; fi
          echo "TG_WEBAPP_URL=$tg" >> "$GITHUB_ENV"
          echo "Адрес мини-приложения в Telegram: $tg"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "mode=data" >> "$GITHUB_OUTPUT"
          else
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and send digest)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_REFRESH_MIN: ${{ vars.X_REFRESH_MIN }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          TG_BOT_ID: ${{ vars.TG_BOT_ID || secrets.TG_BOT_ID }}
          PREMIUM_MODE: ${{ vars.PREMIUM_MODE || secrets.PREMIUM_MODE }}
        run: |
          # подсказка в логе: какие публичные настройки приложения заданы (значения не печатаются)
          for v in SUPABASE_URL SUPABASE_ANON_KEY TG_BOT_ID ONESIGNAL_APP_ID; do
            if [ -n "${!v}" ]; then echo "app config: $v — задан"; else echo "::warning::app config: $v не задан (Settings → Secrets and variables → Actions → Variables)"; fi
          done
          python bot.py --mode ${{ steps.mode.outputs.mode }} --export site

      # Основной хостинг — Cloudflare Pages (если заданы секреты). Ошибка публикации не ломает рассылку.
      - name: Deploy to Cloudflare Pages
        if: env.CF_ON == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$CF_PROJECT" \
            || npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main
          npx --yes wrangler@4 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      # GitHub Pages: до переезда — само приложение, после — переадресация на новый адрес (+ data/ для внешних скриптов)
      - name: Old address → redirect
        if: env.CF_ON == 'true'
        run: python tools/redirect_site.py site ghp "$WEBAPP_URL" "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.CF_ON == 'true' && 'ghp' || 'site' }}
      - uses: actions/deploy-pages@v4
        continue-on-error: true
